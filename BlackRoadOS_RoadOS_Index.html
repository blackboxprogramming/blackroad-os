        function saveState() {
            try {
                const stateToSave = {
                    activeWorkspace: ROAD_OS_STATE.activeWorkspace,
                    selectedAgentId: ROAD_OS_STATE.selectedAgentId,
                    selectedProductId: ROAD_OS_STATE.selectedProductId,
                    selectedDomainId: ROAD_OS_STATE.selectedDomainId,

                    receipts: ROAD_OS_STATE.receipts,
                    chatLog: ROAD_OS_STATE.chatLog,
                    receiptCounter: ROAD_OS_STATE.receiptCounter
                };
                localStorage.setItem('ROAD_OS_STATE', JSON.stringify(stateToSave));
            } catch (e) {
                console.warn('Failed to save state:', e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('ROAD_OS_STATE');
                if (saved) {
                    const loaded = JSON.parse(saved);
                    Object.assign(ROAD_OS_STATE, loaded);
                    addChatLog('State restored from localStorage', 'System');
                }
            } catch (e) {
                console.warn('Failed to load state:', e);
            }
        }

        // ===== INDEX LANES GENERATION =====

        function generateIndexLanes() {
            const lanes = [];
            let id = 1;

            for (let cmd of ROAD_OS_CANON.commands) {
                for (let prod of ROAD_OS_CANON.products) {
                    for (let dom of ROAD_OS_CANON.domains) {
                        const lane = {
                            id: `LANE_${String(id).padStart(5, '0')}`,
                            command: cmd.name,
                            product: prod.name,
                            domain: dom.domain,
                            purpose: `${cmd.purpose} on ${prod.name} in ${dom.domain}`,
                            workspace: 'index'
                        };
                        lanes.push(lane);
                        id++;
                        if (id > 17290) break;
                    }
                    if (id > 17290) break;
                }
                if (id > 17290) break;
            }

            return lanes;
        }

                <div class="chat-entry">
                    <div class="chat-time">${entry.timestamp}</div>
                    <div class="chat-text"><strong>${entry.source}:</strong> ${entry.message}</div>
                </div>
            `).join('');
            return entries;
        }

        function renderReceiptDrawer() {
            const entries = ROAD_OS_STATE.receipts.slice(-10).reverse().map(receipt => `
                <div class="receipt-item">
                    <span class="receipt-id">${receipt.id}</span><br>
                    <span class="receipt-type">${receipt.type}</span><br>
                    <span class="receipt-status">${receipt.status} @ ${receipt.timestamp}</span>
                </div>
            `).join('');
            return entries;
        }

        function renderStatusBar() {
            const bar = document.getElementById('status-bar');
            const agent = ROAD_OS_STATE.selectedAgentId ? ROAD_OS_CANON.agents.find(a => a.number === ROAD_OS_STATE.selectedAgentId) : null;
            const product = ROAD_OS_STATE.selectedProductId ? ROAD_OS_CANON.products.find(p => p.number === ROAD_OS_STATE.selectedProductId) : null;
            const domain = ROAD_OS_STATE.selectedDomainId ? ROAD_OS_CANON.domains.find(d => d.number === ROAD_OS_STATE.selectedDomainId) : null;

            bar.innerHTML = `
                <div class="status-item"><span class="status-label">Workspace:</span> <span class="status-value">${ROAD_OS_STATE.activeWorkspace}</span></div>
                <div class="status-item"><span class="status-label">Agent:</span> <span class="status-value">${agent ? agent.name : '—'}</span></div>
                <div class="status-item"><span class="status-label">Product:</span> <span class="status-value">${product ? product.name : '—'}</span></div>
                <div class="status-item"><span class="status-label">Domain:</span> <span class="status-value">${domain ? domain.domain : '—'}</span></div>
                <div class="status-item"><span class="status-label">Lanes:</span> <span class="status-value">${ROAD_OS_STATE.indexLanes.length}</span></div>
                <div class="status-item"><span class="status-label">Receipts:</span> <span class="status-value">${ROAD_OS_STATE.receipts.length}</span></div>
                <div class="status-item"><span class="status-label">Operator:</span> <span class="status-value">${ROAD_OS_CANON.operator.name}</span></div>
            `;
        }

        function render() {
            renderDesktop();
            renderStatusBar();

            const container = document.getElementById('workspaces-container');
            let content = '';

            switch (ROAD_OS_STATE.activeWorkspace) {
                case 'home':
                    content = renderHome();
                    break;
                case 'agents':
                    content = renderAgents();
                    break;
                case 'products':
                    content = renderProducts();
                    break;
                case 'domains':
                    content = renderDomains();
                    break;
                case 'orgs':
                    content = renderOrganizations();
                    break;
                case 'apps':
                    content = renderApps();
                    break;
                case 'files':
                    content = renderFiles();
                    break;
                case 'index':
                    content = renderIndex();
                    break;
                default:
                    content = renderHome();
            }

            container.innerHTML = `<div class="workspace active">${content}</div>`;
            document.getElementById('receipt-drawer').innerHTML = renderReceiptDrawer();
            document.getElementById('chat-panel').innerHTML = renderChatLog();
        }

        // ===== INITIALIZATION =====

        document.addEventListener('DOMContentLoaded', () => {
            loadState();

            ROAD_OS_STATE.indexLanes = generateIndexLanes();
            addChatLog(`BlackRoad OS initialized — ${ROAD_OS_STATE.indexLanes.length} index lanes generated`, 'System');
            addReceipt('SYSTEM_BOOT', 'RoadOS', 'home', 'DONE_VERIFIED');

            render();
        });

        window.addEventListener('beforeunload', () => {
            saveState();
        });
    </script>
</body>
</html>
