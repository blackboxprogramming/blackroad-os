name: Registry

# Guards the single source of truth. Every push / PR must keep
# Registry/products.json valid AND index.html in sync with it.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Registry/products.json
        run: node scripts/validate-registry.mjs
      - name: Validate Registry/agents.json
        run: node scripts/validate-agents.mjs
      - name: Validate Registry/orgs.json + domains.json
        run: node scripts/validate-collections.mjs
      - name: Check index.html PRODUCTS is in sync with the registry
        run: node scripts/sync-products.mjs --check
      - name: Check index.html ORGS + DOMAINS are in sync with their registries
        run: node scripts/sync-collections.mjs --check
      - name: Check per-folder product.json is in sync with the registry
        run: node scripts/sync-product-folders.mjs --check
