name: Registry

# Guards the single source of truth. Every push / PR must keep
# Registry/products.json valid AND index.html in sync with it.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate all registries and generated projections
        run: node scripts/validate-all.mjs
      - name: Run the validator/sync test suite
        run: node --test 'test/**/*.test.mjs'
