[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-network"
version = "0.2.0"
description = "BlackRoad network canon validator, provider discovery planner, compiler, and receipt writer"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "BlackRoad OS, Inc." }]
dependencies = []

[project.scripts]
road-network = "road_network.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
